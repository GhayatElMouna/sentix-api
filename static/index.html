<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentix — Analyse de sentiment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css?v=5" />
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-inner">
        <div class="brand">
          <span class="logo" aria-hidden="true"></span>
          <div>
            <p class="brand-name">Sentix</p>
            <p class="brand-tag">Lecture des avis d’un post</p>
          </div>
        </div>
      </div>
    </header>

    <main class="shell">
      <section class="intro">
        <h1>Analyser les commentaires d’un post</h1>
        <p class="intro-copy">
          Indiquez le lien du post, saisissez un commentaire, puis lancez
          l’analyse. Les totaux positif et négatif restent attachés à ce lien.
        </p>
      </section>

      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title" class="sr-only">Formulaire d’analyse</h2>

        <label class="field">
          <span>Lien du post</span>
          <input
            id="post-url"
            type="url"
            inputmode="url"
            placeholder="https://…"
            autocomplete="off"
          />
        </label>

        <label class="field">
          <span>Commentaire</span>
          <textarea
            id="comment"
            rows="4"
            placeholder="Saisissez un commentaire à analyser"
          ></textarea>
        </label>

        <div class="toolbar">
          <button id="analyze" class="btn-primary" type="button">
            Lancer l’analyse
          </button>
        </div>
      </section>

      <p id="banner" class="banner" hidden role="alert"></p>
      <p id="status" class="status" hidden></p>

      <div id="latest"></div>
      <div id="counters"></div>
      <div id="history"></div>
    </main>

    <script src="/static/app.js?v=5"></script>
  </body>
</html>
